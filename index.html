<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Game Console</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }
    h1 { margin-top: 20px; font-size: 2.2rem; }
    .grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .card {
      background: #222;
      border: 3px solid #444;
      border-radius: 12px;
      padding: 20px;
      width: 220px;
      cursor: pointer;
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
    }
    .card:focus, .card:hover {
      border-color: #00ffcc;
      background: #333;
      transform: scale(1.05);
      outline: none;
    }
    #game-container { width: 100vw; height: 100vh; display: none; }
    #connection-info {
      background: #222;
      padding: 12px;
      margin: 15px auto;
      width: 80%;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .url-text { color: #00ffcc; font-weight: bold; }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="menu">
    <h1>📺 TV Game Console</h1>
    
    <div id="connection-info">
      <p style="margin: 0 0 5px 0;">🎮 Controller / Phone Link:</p>
      <span class="url-text">https://wiiDS-tv.github.io/wiiDS-tv/controller.html</span>
    </div>

    <div class="grid">
      <!-- NDS Games (Loaded via uploaded GitHub ROMs) -->
      <button class="card" autofocus onclick="loadGame('nds', './mariokartds.nds')">
        🏎️ Mario Kart DS
      </button>

      <button class="card" onclick="loadGame('nds', './nsmb.nds')">
        🍄 New Super Mario Bros DS
      </button>

      <!-- Wii Games (Launch Dolphin TV App) -->
      <button class="card" onclick="launchWiiApp()">
        🎾 Wii Sports
      </button>

      <button class="card" onclick="launchWiiApp()">
        🏎️ Mario Kart Wii
      </button>
    </div>
  </div>

  <div id="game-container"></div>

  <script>
    // 1. PeerJS Remote Controller
    const peer = new Peer('wiids-tv-room');
    peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        if (data.type === 'key') {
          const eventType = data.pressed ? 'keydown' : 'keyup';
          window.dispatchEvent(new KeyboardEvent(eventType, { key: data.key, bubbles: true }));
        }
      });
    });

    // 2. Sony Remote Key Handler
    window.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.keyCode === 13) {
        const activeElem = document.activeElement;
        if (activeElem && activeElem.classList.contains('card')) {
          activeElem.click();
        }
      }
    });

    // 3. Load NDS Web Emulator
    function loadGame(core, url) {
      document.getElementById('menu').style.display = 'none';
      const container = document.getElementById('game-container');
      container.style.display = 'block';

      Elicitation_player = '#game-container';
      EJS_core = core;
      EJS_gameUrl = url;
      EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

      const script = document.createElement('script');
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(script);
    }

    // 4. Launch Dolphin TV App for Wii Titles
    function launchWiiApp() {
      // Attempts to launch Dolphin Android TV app or notifies user
      window.location.href = "intent://org.dolphinemu.dolphinemu/#Intent;scheme=launch;package=org.dolphinemu.dolphinemu;end";
    }
  </script>
</body>
</html>
