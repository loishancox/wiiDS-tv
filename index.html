<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TV Game Console</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      background: #111;
      color: #fff;
      font-family: Arial, sans-serif;
      text-align: center;
      overflow: hidden;
    }
    h1 { margin-top: 20px; font-size: 2.2rem; }
    .grid {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .card {
      background: #222;
      border: 3px solid #444;
      border-radius: 12px;
      padding: 20px;
      width: 200px;
      cursor: pointer;
      color: #fff;
      font-size: 1.2rem;
      font-weight: bold;
    }
    .card:focus, .card:hover {
      border-color: #00ffcc;
      background: #333;
      transform: scale(1.05);
      outline: none;
    }
    #game-container { width: 100vw; height: 100vh; display: none; }
    #connection-info {
      background: #222;
      padding: 15px;
      margin: 15px auto;
      width: 80%;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .url-text { color: #00ffcc; font-weight: bold; font-size: 1.1rem; }
  </style>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
</head>
<body>

  <div id="menu">
    <h1>📺 TV Game Console</h1>
    
    <div id="connection-info">
      <p style="margin: 0 0 5px 0;">🎮 Play with Sony Remote <b>OR</b> Phone Web Remote:</p>
      <span class="url-text">https://wiiDS-tv.github.io/wiiDS-tv/controller.html</span>
    </div>

    <div class="grid">
      <!-- Press Enter/Select on TV Remote or Tap on Phone to launch -->
      <button class="card" autofocus onclick="loadGame('nds', 'YOUR_MARIO_KART_DS_LINK.nds')">🏎️ Mario Kart DS</button>
      <button class="card" onclick="loadGame('nds', 'YOUR_NSMB_DS_LINK.nds')">🍄 New Super Mario</button>
    </div>
  </div>

  <div id="game-container"></div>

  <script>
    // 1. SETUP PHONE CONTROLLER CONNECTION (PeerJS)
    const peer = new Peer('wiids-tv-room');

    peer.on('connection', (conn) => {
      conn.on('data', (data) => {
        // When phone sends a key press, trigger it on the TV
        if (data.type === 'key') {
          const eventType = data.pressed ? 'keydown' : 'keyup';
          window.dispatchEvent(new KeyboardEvent(eventType, { key: data.key, bubbles: true }));
        }
      });
    });

    // 2. SETUP SONY TV REMOTE NAVIGATION
    window.addEventListener('keydown', (e) => {
      // Map Sony Remote Enter / D-Pad Select button
      if (e.key === 'Enter' || e.keyCode === 13) {
        const activeElem = document.activeElement;
        if (activeElem && activeElem.classList.contains('card')) {
          activeElem.click();
        }
      }
    });

    // 3. LAUNCH GAME
    function loadGame(core, url) {
      document.getElementById('menu').style.display = 'none';
      const container = document.getElementById('game-container');
      container.style.display = 'block';

      Elicitation_player = '#game-container';
      EJS_core = core;
      EJS_gameUrl = url;
      EJS_pathtodata = 'https://cdn.emulatorjs.org/stable/data/';

      const script = document.createElement('script');
      script.src = 'https://cdn.emulatorjs.org/stable/data/loader.js';
      document.body.appendChild(script);
    }
  </script>
</body>
</html>
